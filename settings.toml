# Flup settings
#
# Every number the model uses lives in this file. Edit it on GitHub (pencil
# icon), commit, and the next data run picks up the change.

[league]
id = "1374496898462785536"
username = "clos512"

# What you know about your league. The site compares these with what Sleeper
# reports and flags any mismatch. They are checks only: scoring always uses
# the real settings pulled from Sleeper.
[league.expect]
teams = 12
rec = 0.5                 # half PPR
bonus_rec_te = 0.5        # TEs get +0.5 per catch on top (full PPR for TEs)
pass_td = 6
pass_int = -3
kr_yd = 0.05              # kick return yards
pr_yd = 0.05              # punt return yards
rb_slots = 2
flex_slots = 2
playoff_week_start = 15
playoff_week_end = 17
playoff_teams = 8

# How many players per position get tiered. Your own players and your
# opponent's are always listed, even below these cutoffs.
[positions]
QB = 24
RB = 48
WR = 60
TE = 24
K = 16
DEF = 20

# Local-gap tiers (same method as the draft boards, measured in points).
# Going down the list, a new tier starts when the gap to the next player is
# bigger than gap_multiplier x the median of the nearby gaps.
[tiers]
gap_multiplier = 2.2
window = 24               # nearby gaps used for the median (12 above, 12 below)
min_tier_size = 3         # tiers stay at least this big...
always_break_gap = 1.5    # ...unless the gap is this many points or more
min_median_gap = 0.2      # points; stops near-ties from splitting every player

# Defense points-allowed brackets: projections give an average (say 15.5),
# but your league scores brackets. true = blend between bracket midpoints so
# 20.9 and 21.1 points allowed don't score wildly differently.
[scoring]
smooth_def_brackets = true

# ---------------------------------------------------------------------------
# My Score = blend of projection and consensus + small adjustments - injury
# ---------------------------------------------------------------------------

# Start from this mix of Sleeper's projection (in your scoring) and the
# expert consensus rank (turned into points with your scoring).
[blend]
projection = 0.60
consensus = 0.40

# Each adjustment is small and capped. The first four together can move a
# player at most total_cap points. Return yards and injury are separate.
[adjust]
total_cap = 3.0

# Share of team snaps / targets / carries in the last few games vs the season
[adjust.usage]
weight = 0.25             # how much of the trend counts (0.25 = a 20% jump adds 5%)
cap = 1.5                 # most this can add or take away (points)
recent_games = 3
min_games = 4             # this season, before trends count

# Vegas: team's implied points vs this week's average, plus game script
[adjust.environment]
weight = 0.30
spread_rb = 0.04          # points per point of spread (favored RBs run more)
spread_pass = 0.02        # points per point of spread (trailing teams throw more)
cap = 1.5

# Points the opponent allows to the position vs the league average
[adjust.matchup]
weight = 0.30
shrink_games = 4          # an opponent's numbers count half at this many games, more after
cap = 1.5

# QBs, from game logs (not names): a penalty for throwing picks above the
# league rate, and a bonus for low-INT QBs whose points lean on running.
# The projection already counts its own expected picks, so keep these small.
[adjust.qb]
int_weight = 0.5          # share of the extra picks' cost applied
int_cap = 1.0
shrink_attempts = 150     # his own INT rate counts half at this many attempts
rush_share_start = 0.15   # rushing share of points where the bump starts...
rush_share_full = 0.35    # ...and where it reaches the full rush_bonus
rush_bonus = 0.6

# Return men: a small bump for return-TD upside. Return yards the
# projection doesn't include are added from recent games.
[adjust.returns]
recent_games = 3
min_returns_per_game = 1.0
bonus = 0.3
cap = 4.0

# Share of the score taken off by injury status. Questionable comes off the
# projection's part only (the experts' ranks already account for injuries).
# Doubtful and Out are also flagged on the card.
[adjust.injury]
questionable = 0.08
doubtful = 0.60
out = 1.00

# Floor and ceiling come from each player's weekly scores in your scoring
# (this season plus the end of last season), scaled to this week's score.
[floor_ceiling]
floor_pct = 25
ceiling_pct = 90
last_season_games = 12    # most recent games from last season to include
shrink_games = 6          # a player's own spread counts half at this many games

# ---------------------------------------------------------------------------
# Lineup and win %
# ---------------------------------------------------------------------------

# Win % comes from your best lineup by My Score. Favored: players are ranked
# partway toward their floor (playing it safe). Underdog: partway toward
# their ceiling (swinging for upside). In between: My Score as is.
[lineup]
favored = 0.65            # win chance at or above this = favored
underdog = 0.35           # win chance below this = underdog
lean = 0.5                # how far toward floor/ceiling: 0 = not at all, 1 = all the way
close_call = 1.5          # points; starters closer than this to a bench player are close calls
free_agents = 5           # most free agents to list (worth starting first, then the best of the rest)

# Labels on bench and free-agent players, against the usual for his position
[labels]
boom = 1.05               # ceiling/score at least 5% above usual: "Boom"
steady = 1.10             # floor/score at least 10% above usual: "Steady"

[stale]
# The page warns when the data is older than this
data_hours = 36
