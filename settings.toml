# Flup settings
#
# Every number the model uses lives in this file. Edit it on GitHub (pencil
# icon), commit, and the next data run picks up the change.

[league]
id = "1374496898462785536"
username = "clos512"

# What you know about your league. The site compares these with what Sleeper
# reports and flags any mismatch. They are checks only: scoring always uses
# the real settings pulled from Sleeper.
[league.expect]
teams = 12
rec = 0.5                 # half PPR
bonus_rec_te = 0.5        # TEs get +0.5 per catch on top (full PPR for TEs)
pass_td = 6
pass_int = -3
kr_yd = 0.05              # kick return yards
pr_yd = 0.05              # punt return yards
rb_slots = 2
flex_slots = 2
playoff_week_start = 15
playoff_week_end = 17
playoff_teams = 8

# How many players per position get tiered. Your own players and your
# opponent's are always listed, even below these cutoffs.
[positions]
QB = 24
RB = 48
WR = 60
TE = 24
K = 16
DEF = 20

# Local-gap tiers (same method as the draft boards, measured in points).
# Going down the list, a new tier starts when the gap to the next player is
# bigger than gap_multiplier x the median of the nearby gaps.
[tiers]
gap_multiplier = 2.2
window = 24               # nearby gaps used for the median (12 above, 12 below)
min_tier_size = 3         # tiers stay at least this big...
always_break_gap = 1.5    # ...unless the gap is this many points or more
min_median_gap = 0.2      # points; stops near-ties from splitting every player

# Defense points-allowed brackets: projections give an average (say 15.5),
# but your league scores brackets. true = blend between bracket midpoints so
# 20.9 and 21.1 points allowed don't score wildly differently.
[scoring]
smooth_def_brackets = true

# ---------------------------------------------------------------------------
# Predicted points = blend of projection and consensus + small adjustments - injury
# ---------------------------------------------------------------------------

# Start from this mix of Sleeper's projection (in your scoring) and the
# expert consensus rank (turned into points with your scoring).
[blend]
projection = 0.60
consensus = 0.40

# Each adjustment is small and capped. The first four together can move a
# player at most total_cap points. Return yards and injury are separate.
[adjust]
total_cap = 3.0

# Share of team snaps / targets / carries in the last few games vs the season.
# Off (2026-10-13): the 2025 backtest (docs/BACKTEST.md) found it didn't
# help in either half of the season (for RBs it pointed the wrong way).
# List positions here to turn it back on.
[adjust.usage]
positions = []
weight = 0.25             # how much of the trend counts (0.25 = a 20% jump adds 5%)
cap = 1.5                 # most this can add or take away (points)
recent_games = 3
min_games = 4             # this season, before trends count

# Vegas: team's implied points vs this week's average, plus game script
[adjust.environment]
weight = 0.30
spread_rb = 0.04          # points per point of spread (favored RBs run more)
spread_pass = 0.02        # points per point of spread (trailing teams throw more)
cap = 1.5

# Points the opponent allows to the position vs the league average.
# Not for RBs and WRs (2026-10-13): in the 2025 backtest it flipped
# direction between the two halves of the season for them (docs/BACKTEST.md).
[adjust.matchup]
positions = ["QB", "TE", "K", "DEF"]
weight = 0.30
shrink_games = 4          # an opponent's numbers count half at this many games, more after
cap = 1.5

# QBs, from game logs (not names): a penalty for throwing picks above the
# league rate, and a bonus for low-INT QBs whose points lean on running.
# The projection already counts its own expected picks, so keep these small.
[adjust.qb]
int_weight = 0.5          # share of the extra picks' cost applied
int_cap = 1.0
shrink_attempts = 150     # his own INT rate counts half at this many attempts
rush_share_start = 0.15   # rushing share of points where the bump starts...
rush_share_full = 0.35    # ...and where it reaches the full rush_bonus
rush_bonus = 0.6

# Return men (at least min_returns_per_game in recent games). The backtest
# (docs/BACKTEST.md): real return yards ran about double the projection's
# (1.1 projected pts, 2.3 real), so its return points count `extra` more
# (1.0 = twice), up to `cap`. Heavy returners' other points run under their
# projection, so uncapped doubling over-predicted them (2026: -0.9); a cap
# of 1.0 kept return men unbiased in both halves of 2025 and in 2026. A
# recent returner whose projection has no return yards had often lost the
# job (only 42% still returned): nothing added. (Was: +0.3 bonus, plus
# recent yards when the projection had none.)
[adjust.returns]
recent_games = 3
min_returns_per_game = 1.0
extra = 1.0
cap = 1.0

# Share of the score taken off by injury status. Questionable comes off the
# projection's part only (the experts' ranks already account for injuries).
# Doubtful and Out are also flagged on the card. Doubtful is flagged only
# (owner, 2026-10-11): no points off; it was 0.60.
[adjust.injury]
questionable = 0.08
doubtful = 0.0
out = 1.00

# Floor and ceiling come from each player's weekly scores in your scoring
# (this season plus the end of last season), scaled to this week's score.
[floor_ceiling]
floor_pct = 25
ceiling_pct = 90
last_season_games = 12    # most recent games from last season to include
shrink_games = 6          # a player's own spread counts half at this many games
# Past weekly scores alone come out too narrow (the prediction misses too).
# The 2025 backtest (docs/BACKTEST.md): spread 1.2x as far from Predicted,
# ~25% of games land under the floor, ~10% over the ceiling and ~68%
# within one sd (was 32-38% / 12-16% / 60-63%). It also widens the sd that
# win % adds up, so win % is less sure of itself.
stretch = 1.2

# ---------------------------------------------------------------------------
# Lineup and win %
# ---------------------------------------------------------------------------

# Win % comes from your best lineup by predicted points. Favored: players are ranked
# partway toward their floor (playing it safe). Underdog: partway toward
# their ceiling (swinging for upside). In between: predicted points as is.
[lineup]
favored = 0.65            # win chance at or above this = favored
underdog = 0.35           # win chance below this = underdog
lean = 0.5                # how far toward floor/ceiling: 0 = not at all, 1 = all the way
close_call = 1.5          # points; starters closer than this to a bench player are close calls
free_agents = 5           # most free agents to list (worth starting first, then the best of the rest)

# Labels on bench and free-agent players, against the usual for his position
[labels]
boom = 1.05               # ceiling/score at least 5% above usual: "Boom"
steady = 1.10             # floor/score at least 10% above usual: "Steady"
# Positions whose "Steady" comes from WOPR this season instead (1.5 x share
# of team targets + 0.7 x share of team air yards on catches, from
# Sleeper's stats), at wopr_steady or more. Off: after a review fix (air
# share kept to 0-100%), WOPR 0.45+ didn't beat the floor rule for TEs in
# both halves of 2025 (duds 20% vs 18% in weeks 4-11, 17% vs 29% in
# 12-18; docs/BACKTEST.md). List "TE" to try it.
wopr_positions = []
wopr_steady = 0.45

[stale]
# The page warns when the data is older than this
data_hours = 36
# ...or older than this on a game day (a game today, Eastern time)
game_day_hours = 3
# A Questionable/Doubtful player whose latest Sleeper news is older than
# this before kickoff gets "no injury news since ..." (shown in the last day)
injury_news_hours = 24

[rest]
# Late in the season, players on teams that have clinched may sit. They're
# flagged on the card (no points off) in these weeks (17 = your final).
weeks = [16, 17]
# ESPN clinch marks that count: "*" = clinched the #1 seed (the only bye),
# "z" = won the division (its seed may still be in play, so the card says
# "if its seed is locked"). Add "y"/"x" to flag wild cards too.
clinchers = ["*", "z"]

[news]
# Links per player: headline, source, date and link only, newest first.
# For my roster, the opponent's starters and suggested free agents.
max_links = 3
days = 7
# A beat writer with no posts in this many days is listed as inactive
inactive_days = 14
# League-wide fantasy news on Bluesky, every team (owner's pick 2026-10-13:
# RotoWire "is gold for accuracy"). A post counts for a player when it names
# him in full, or by a last name no other projected player has. Each run
# reads back `days` days, up to this many pages of 100 posts per account
# (RotoWire posts about 60 a day, Rotoworld about 50: checked 2026-10-12).
league_wide = ["rotowirenfl.bsky.social", "rotoworld-fb.bsky.social"]
league_wide_pages = 6
# Links to these sites get a lock (subscription needed)
paywalled = ["nytimes.com/athletic", "theathletic.com", "4for4.com",
             "sharpfootballanalysis.com", "fantasylife.com"]

