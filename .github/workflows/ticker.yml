# Keeps the data fresh even though GitHub drops most scheduled runs (on
# 2026-10-11 only 4 of about 24 Sunday slots ran). Each run is one link of a
# chain: wait for the next update.yml slot (tools/next_run.py), start
# update.yml, start the next link. GitHub's own token may start "Run
# workflow" events, so no key is needed, and runner time is free on a public
# repo. If the chain breaks, the schedule below restarts it; update.yml's own
# schedule keeps running as before (it skips a slot the Ticker already ran).
name: Ticker

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"   # restart the chain if it broke
  push:                      # on a branch: only checks the next slot works out
    branches: ["claude/**"]
    paths: [".github/workflows/ticker.yml", "tools/next_run.py"]

permissions:
  actions: write
  contents: read

# One link at a time. A new link replaces the one before it; a scheduled
# restart only waits its turn (it runs right away when the chain is broken,
# and the chain's next link replaces it otherwise), so it never cuts off a
# link that's about to start an update.
concurrency:
  group: ticker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Next update slot (branch check only)
        if: github.ref != 'refs/heads/main'
        run: python3 tools/next_run.py

      - name: Wait for the next update slot
        id: wait
        if: github.ref == 'refs/heads/main'
        run: python3 tools/next_run.py --wait 5.5 >> "$GITHUB_OUTPUT"

      - name: Start the data update
        if: github.ref == 'refs/heads/main' && steps.wait.outputs.due == 'true'
        run: |
          # Not if one started in the last 10 minutes (update.yml's own
          # schedule does fire sometimes)
          last=$(gh run list --workflow update.yml --branch main --limit 1 --json createdAt --jq '.[0].createdAt // empty' || true)
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 600 ]; then
            echo "An update started at $last: not starting another"
            exit 0
          fi
          for try in 1 2 3 4 5; do
            gh workflow run update.yml --ref main && exit 0
            sleep 20
          done
          exit 1

      - name: Start the next link
        # Only after a clean wait (never a tight loop if something's broken),
        # and not when this link was replaced: the new one carries on
        if: ${{ !cancelled() && steps.wait.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: |
          for try in 1 2 3 4 5; do
            gh workflow run ticker.yml --ref main && exit 0
            sleep 20
          done
          exit 1
