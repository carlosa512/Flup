# Fetches Sleeper + ESPN data, scores and tiers it, and publishes the site
# (with the fresh data) to the gh-pages branch, which GitHub Pages serves.
# If anything fails, nothing is published and the site keeps its last data.
name: Update data

on:
  schedule:
    # GitHub's clock is UTC, so each time is listed twice to cover both
    # daylight (EDT) and standard (EST) time. Runs can start 5-30 min late.
    - cron: "7 13,14 * * 3"    # Wednesday about 9 AM Eastern: projections
    - cron: "7 22,23 * * 5"    # Friday about 6 PM Eastern: final injury reports
    - cron: "45 15,16 * * 0"   # Sunday about 11:45 AM Eastern: inactives, 1 PM games
    - cron: "15 19,20 * * 0"   # Sunday about 3:15 PM Eastern: late games
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: ["main", "claude/**"]
    paths:
      - "pipeline/**"
      - "site/**"
      - "tests/**"
      - "settings.toml"
      - "requirements*.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q

      - name: Fetch, score and tier
        env:
          FLUP_RECORD: ${{ runner.temp }}/raw
        run: python -m pipeline

      - name: Publish site and data to gh-pages
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7}-${GITHUB_RUN_ID}/" site/sw.js
          cp -r site "$RUNNER_TEMP/publish"
          touch "$RUNNER_TEMP/publish/.nojekyll"
          cd "$RUNNER_TEMP/publish"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site and data from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # Development only: keep the raw responses so changes can be built and
      # tested offline against real data (FLUP_REPLAY).
      - name: Save raw responses
        if: startsWith(github.ref, 'refs/heads/claude/')
        working-directory: ${{ runner.temp }}/raw
        run: |
          git init -q -b dev-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Raw responses $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-raw
