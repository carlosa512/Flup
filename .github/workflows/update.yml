# Fetches Sleeper + ESPN data, scores and tiers it, and publishes the site
# (with the fresh data) to the gh-pages branch, which GitHub Pages serves.
# If anything fails, nothing is published and the site keeps its last data.
name: Update data

on:
  schedule:
    # GitHub's clock is UTC, so each time is listed twice to cover both
    # daylight (EDT) and standard (EST) time. Runs can start 5-30 min late.
    - cron: "7 13,14 * * 3"    # Wednesday about 9 AM Eastern: projections
    - cron: "7 22,23 * * 5"    # Friday about 6 PM Eastern: final injury reports
    - cron: "45 15,16 * * 0"   # Sunday about 11:45 AM Eastern: inactives, 1 PM games
    # Sunday during the games, every 30 min from about 1 PM to 12:30 AM
    # Eastern (live points, late-game inactives). Minutes 7/37 dodge the
    # top-of-hour rush that delays scheduled runs.
    - cron: "7,37 17-23 * * 0"
    - cron: "7,37 0-4 * * 1"
    # Thursday and Monday night games: every 30 min from about 6 PM
    # (inactives) to 12:30 AM Eastern
    - cron: "7,37 22-23 * * 1,4"
    - cron: "7,37 0-4 * * 2,5"
    # Saturday games in December and early January (the fantasy playoffs,
    # weeks 15-17): every 30 min from about 1 PM to 12:30 AM Eastern
    - cron: "7,37 17-23 * 12,1 6"
    - cron: "7,37 0-4 * 12,1 0"
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: ["main", "claude/**"]
    paths:
      - "pipeline/**"
      - "site/**"
      - "tests/**"
      - "settings.toml"
      - "inputs/**"
      - "requirements*.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -q -r requirements-dev.txt
          python -m pytest -q

      - name: Fetch, score and tier
        env:
          FLUP_RECORD: ${{ runner.temp }}/raw
        run: python -m pipeline

      # main publishes the real site at the root. Development branches
      # publish to /preview/ so changes can be tried on a phone without
      # touching the site used on game day. Each keeps the other's files.
      - name: Publish site and data to gh-pages
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          sed -i "s/__BUILD__/${GITHUB_SHA::7}-${GITHUB_RUN_ID}/" site/sw.js
          PUB="$RUNNER_TEMP/publish"
          git clone -q --depth 1 --branch gh-pages "$REPO" "$PUB" 2>/dev/null || mkdir -p "$PUB"
          rm -rf "$PUB/.git"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            find "$PUB" -mindepth 1 -maxdepth 1 ! -name preview -exec rm -rf {} +
            cp -r site/. "$PUB/"
          else
            rm -rf "$PUB/preview"
            mkdir -p "$PUB/preview"
            cp -r site/. "$PUB/preview/"
          fi
          touch "$PUB/.nojekyll"
          cd "$PUB"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site and data from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -qf "$REPO" gh-pages

      # Development only: keep the raw responses so changes can be built and
      # tested offline against real data (FLUP_REPLAY).
      - name: Save raw responses
        if: startsWith(github.ref, 'refs/heads/claude/')
        working-directory: ${{ runner.temp }}/raw
        run: |
          git init -q -b dev-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Raw responses $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-raw
