# Development helper: saves raw Sleeper and ESPN responses to the
# dev-snapshots branch so the parsers can be built against real data.
name: Dev snapshot

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["tools/snapshot.py", ".github/workflows/snapshot.yml"]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch raw responses
        run: python3 tools/snapshot.py out
      - name: Push to dev-snapshots branch
        working-directory: out
        run: |
          git init -q -b dev-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Raw API snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-snapshots
